[build]
  command = "python netlify_deploy.py"
  publish = "output"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[edge_functions]]
  path     = "/*"
  function = "geo-blocker"

[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
