name: 2시간마다 Netlify 자동 배포 (KST 08:00 ~ 02:00)

on:
  # KST 기준 오전 8시 ~ 익일 새벽 2시, 2시간 간격 (UTC 기준)
  # KST = UTC+9 이므로: 23,1,3,5,7,9,11,13,15,17 UTC
  # = 08,10,12,14,16,18,20,22,00,02 KST
  schedule:
    - cron: "0 23,1,3,5,7,9,11,13,15,17 * * *"
  workflow_dispatch:  # 수동 실행 허용

jobs:
  trigger-netlify:
    runs-on: ubuntu-latest
    steps:
      - name: Netlify Build Hook 트리거
        run: |
          curl -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"
          echo "✅ Netlify 빌드 트리거 완료"
          echo "   실행 시각 (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
