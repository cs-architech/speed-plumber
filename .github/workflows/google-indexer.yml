name: Google 인덱싱 API (1시간마다 10개, 하루 100개)

on:
  schedule:
    - cron: "0 * * * *"  # 매 시간 정각 (UTC 기준)
  workflow_dispatch:      # 수동 실행 허용

permissions:
  contents: write  # indexer_state.json 커밋용

concurrency:
  group: google-indexer
  cancel-in-progress: false  # 이전 실행 취소하지 않음

jobs:
  google-index:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install google-auth requests

      - name: 서비스 계정 JSON 복원
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 -c "import os,json; d=json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON'].strip()); open('service_account.json','w').write(json.dumps(d))"

      - name: Google 수집 요청 실행
        run: python google_indexer.py

      - name: 서비스 계정 파일 삭제 (보안)
        if: always()
        run: rm -f service_account.json

      - name: 상태 파일 커밋 (변경 있을 때만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indexer_state.json
          git diff --cached --quiet && echo "변경 없음 - 커밋 스킵" || git commit -m "chore: 인덱싱 상태 업데이트 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || echo "push 불필요 (변경 없음)"
