name: IndexNow 제출 (네이버·Bing, 하루 1회)

on:
  schedule:
    - cron: "30 0 * * *"  # 매일 00:30 UTC (KST 09:30) — daily-build 이후 사이트맵이 최신인 시점
  workflow_dispatch:      # 수동 실행 허용
    inputs:
      force:
        description: "전체 URL 강제 재제출 (신규분만이 아니라 전체)"
        type: boolean
        default: false

permissions:
  contents: write  # indexnow_state.json 커밋용

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: IndexNow 제출 실행
        run: python indexnow_submit.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: 상태 파일 커밋 (변경 있을 때만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indexnow_state.json
          git diff --cached --quiet && echo "변경 없음 - 커밋 스킵" || git commit -m "chore: IndexNow 상태 업데이트 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || echo "push 불필요 (변경 없음)"
